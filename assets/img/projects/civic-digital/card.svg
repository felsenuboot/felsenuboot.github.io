<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3445"/>
      <stop offset="1" stop-color="#121722"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1B6E8C" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1B6E8C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- the page: one place, one screen -->
  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="6" fill="#ffffff" fill-opacity="0.04">
    <rect x="330" y="200" width="940" height="590" rx="30"/>
  </g>

  <!-- cards: muted, each standing for one data source -->
  <g transform="translate(0 30)">
  <g stroke="#ffffff" stroke-opacity="0.32" stroke-width="5" fill="none">
    <rect x="380" y="330" width="266" height="190" rx="18"/>
    <rect x="667" y="330" width="266" height="190" rx="18"/>
    <rect x="954" y="330" width="266" height="190" rx="18"/>
    <rect x="380" y="545" width="266" height="190" rx="18"/>
    <rect x="667" y="545" width="266" height="190" rx="18"/>
    <rect x="954" y="545" width="266" height="190" rx="18"/>
  </g>

  <!-- card contents: abstract lines, bars, dots -->
  <g stroke="#ffffff" stroke-opacity="0.42" stroke-width="10" stroke-linecap="round" fill="none">
    <!-- 1: wave (water level) -->
    <path d="M410 460 C450 400, 490 500, 530 440 S600 400, 620 430"/>
    <!-- 2: three list rows (departures) -->
    <line x1="700" y1="395" x2="890" y2="395"/>
    <line x1="700" y1="440" x2="840" y2="440"/>
    <line x1="700" y1="485" x2="870" y2="485"/>
    <!-- 3: bars (air quality) -->
    <line x1="1000" y1="490" x2="1000" y2="420"/>
    <line x1="1050" y1="490" x2="1050" y2="380"/>
    <line x1="1100" y1="490" x2="1100" y2="440"/>
    <line x1="1150" y1="490" x2="1150" y2="400"/>
    <!-- 5: calendar grid (waste) -->
    <line x1="700" y1="605" x2="890" y2="605"/>
    <!-- 6: text rows (council) -->
    <line x1="1000" y1="605" x2="1180" y2="605"/>
    <line x1="1000" y1="650" x2="1120" y2="650"/>
    <line x1="1000" y1="695" x2="1160" y2="695"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.42">
    <!-- 4: sun + cloud (weather) -->
    <circle cx="470" cy="635" r="38"/>
    <rect x="500" y="650" width="120" height="44" rx="22"/>
    <!-- 5: calendar dots -->
    <circle cx="712" cy="650" r="9"/><circle cx="758" cy="650" r="9"/><circle cx="804" cy="650" r="9"/><circle cx="850" cy="650" r="9"/>
    <circle cx="712" cy="695" r="9"/><circle cx="758" cy="695" r="9"/><circle cx="804" cy="695" r="9"/>
  </g>

  </g>

  <!-- the pin: this one place, dropped on the page -->
  <circle cx="800" cy="250" r="220" fill="url(#glow)"/>
  <g transform="translate(800 296) scale(1.15)">
    <path d="M0 40 C-60 -30, -100 -60, -100 -130 A100 100 0 0 1 100 -130 C100 -60, 60 -30, 0 40 Z"
          fill="#1B6E8C" stroke="#ffffff" stroke-opacity="0.9" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="0" cy="-130" r="38" fill="#ffffff"/>
  </g>
</svg>
