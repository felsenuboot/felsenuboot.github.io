<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2722"/>
      <stop offset="1" stop-color="#14130f"/>
    </linearGradient>
    <clipPath id="plate"><rect x="22" y="34" width="84" height="60" rx="8"/></clipPath>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="1.5"/>
  <!-- a plate from the book: three colours flush in a row, Wada's own layout -->
  <g clip-path="url(#plate)">
    <rect x="22" y="34" width="28" height="60" fill="#12354e"/>
    <rect x="50" y="34" width="28" height="60" fill="#d96629"/>
    <rect x="78" y="34" width="28" height="60" fill="#f99d1b"/>
  </g>
  <rect x="22" y="34" width="84" height="60" rx="8" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="2"/>
</svg>
