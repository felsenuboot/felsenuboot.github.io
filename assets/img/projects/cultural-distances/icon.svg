<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3445"/>
      <stop offset="1" stop-color="#121722"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="1.5"/>
  <!-- three dimension tracks -->
  <g stroke="#fff" stroke-opacity=".2" stroke-width="4" stroke-linecap="round">
    <line x1="26" y1="40" x2="102" y2="40"/>
    <line x1="26" y1="64" x2="102" y2="64"/>
    <line x1="26" y1="88" x2="102" y2="88"/>
  </g>
  <!-- the distance between two countries on each -->
  <g stroke="#e5484d" stroke-width="9" stroke-linecap="round">
    <line x1="40" y1="40" x2="84" y2="40"/>
    <line x1="52" y1="64" x2="80" y2="64"/>
    <line x1="34" y1="88" x2="92" y2="88"/>
  </g>
  <!-- country A: filled dots -->
  <g fill="#e6e9ef">
    <circle cx="40" cy="40" r="8"/>
    <circle cx="80" cy="64" r="8"/>
    <circle cx="34" cy="88" r="8"/>
  </g>
  <!-- country B: rings -->
  <g fill="#1a2030" stroke="#e6e9ef" stroke-width="4">
    <circle cx="84" cy="40" r="6.5"/>
    <circle cx="52" cy="64" r="6.5"/>
    <circle cx="92" cy="88" r="6.5"/>
  </g>
</svg>
