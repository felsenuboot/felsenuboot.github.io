<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3445"/>
      <stop offset="1" stop-color="#121722"/>
    </linearGradient>
    <clipPath id="body"><rect x="875" y="420" width="440" height="290" rx="22"/></clipPath>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- window -->
  <rect x="210" y="110" width="1180" height="680" rx="28" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>
  <!-- header bar -->
  <line x1="210" y1="184" x2="1390" y2="184" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>
  <rect x="250" y="134" width="40" height="28" rx="8" fill="#ffffff" fill-opacity="0.22"/>
  <rect x="600" y="132" width="400" height="32" rx="16" fill="#ffffff" fill-opacity="0.12"/>
  <circle cx="1348" cy="148" r="12" fill="#ffffff" fill-opacity="0.22"/>

  <!-- pane dividers -->
  <line x1="430" y1="184" x2="430" y2="790" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>
  <line x1="800" y1="184" x2="800" y2="790" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>

  <!-- sidebar: folders -->
  <g fill="#ffffff" fill-opacity="0.28">
    <circle cx="262" cy="236" r="9"/><rect x="288" y="228" width="100" height="16" rx="8"/>
    <circle cx="262" cy="296" r="9"/><rect x="288" y="288" width="72" height="16" rx="8"/>
    <circle cx="262" cy="356" r="9"/><rect x="288" y="348" width="88" height="16" rx="8"/>
    <circle cx="262" cy="416" r="9"/><rect x="288" y="408" width="60" height="16" rx="8"/>
    <circle cx="262" cy="500" r="9"/><rect x="288" y="492" width="92" height="16" rx="8"/>
    <circle cx="262" cy="560" r="9"/><rect x="288" y="552" width="70" height="16" rx="8"/>
    <circle cx="262" cy="620" r="9"/><rect x="288" y="612" width="104" height="16" rx="8"/>
  </g>

  <!-- message list: selected row -->
  <rect x="446" y="300" width="340" height="100" rx="16" fill="#ffffff" fill-opacity="0.10"/>
  <g fill="#ffffff" fill-opacity="0.28">
    <rect x="470" y="218" width="150" height="16" rx="8"/><rect x="470" y="250" width="270" height="16" rx="8"/>
    <rect x="470" y="318" width="120" height="16" rx="8"/><rect x="470" y="350" width="290" height="16" rx="8"/>
    <rect x="470" y="418" width="170" height="16" rx="8"/><rect x="470" y="450" width="240" height="16" rx="8"/>
    <rect x="470" y="518" width="130" height="16" rx="8"/><rect x="470" y="550" width="280" height="16" rx="8"/>
    <rect x="470" y="618" width="160" height="16" rx="8"/><rect x="470" y="650" width="230" height="16" rx="8"/>
    <rect x="470" y="718" width="140" height="16" rx="8"/><rect x="470" y="750" width="260" height="16" rx="8"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="2">
    <line x1="446" y1="292" x2="786" y2="292"/>
    <line x1="446" y1="492" x2="786" y2="492"/>
    <line x1="446" y1="592" x2="786" y2="592"/>
    <line x1="446" y1="692" x2="786" y2="692"/>
  </g>

  <!-- reading pane: the letter pulled out of its envelope (accent) -->
  <!-- envelope back and open flap -->
  <rect x="875" y="420" width="440" height="290" rx="22" fill="#245d8a"/>
  <polygon points="875,432 1315,432 1095,226" fill="#3385c6"/>
  <!-- the letter -->
  <rect x="935" y="306" width="320" height="290" rx="16" fill="#ffffff" fill-opacity="0.92"/>
  <g fill="#1b2433" fill-opacity="0.55">
    <rect x="967" y="330" width="150" height="16" rx="8"/>
    <rect x="967" y="374" width="256" height="12" rx="6"/>
    <rect x="967" y="402" width="230" height="12" rx="6"/>
    <rect x="967" y="430" width="248" height="12" rx="6"/>
    <rect x="967" y="458" width="200" height="12" rx="6"/>
  </g>
  <!-- envelope front pocket -->
  <polygon points="875,420 1095,600 1315,420 1315,710 875,710" fill="#0067b9" clip-path="url(#body)"/>
</svg>
