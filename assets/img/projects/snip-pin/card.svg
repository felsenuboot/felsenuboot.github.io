<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3445"/>
      <stop offset="1" stop-color="#121722"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb056"/>
      <stop offset="1" stop-color="#ff6a2a"/>
    </linearGradient>
    <linearGradient id="img" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5aa7ff"/>
      <stop offset="1" stop-color="#7bd3c9"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="40" stdDeviation="36" flood-color="#000" flood-opacity=".6"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- abstract window, frozen and dimmed -->
  <g transform="translate(300 170)">
    <rect width="1000" height="600" rx="28" fill="#1e2534" stroke="#fff" stroke-opacity=".1" stroke-width="4"/>
    <rect width="1000" height="64" rx="28" fill="#fff" fill-opacity=".05"/>
    <rect y="32" width="1000" height="32" fill="#fff" fill-opacity=".05"/>
    <g fill="#fff" fill-opacity=".22">
      <circle cx="42" cy="32" r="11"/><circle cx="78" cy="32" r="11"/><circle cx="114" cy="32" r="11"/>
    </g>
    <g fill="#fff" fill-opacity=".14">
      <rect x="60" y="120" width="520" height="26" rx="13"/>
      <rect x="60" y="176" width="360" height="26" rx="13"/>
      <rect x="60" y="232" width="620" height="26" rx="13"/>
      <rect x="640" y="320" width="300" height="220" rx="16" fill-opacity=".08"/>
      <rect x="60" y="540" width="420" height="26" rx="13"/>
    </g>
    <!-- hole where the element was: dashed outline -->
    <rect x="60" y="320" width="520" height="190" rx="14" fill="#000" fill-opacity=".25" stroke="#fff" stroke-opacity=".35" stroke-width="4" stroke-dasharray="18 14"/>
  </g>

  <!-- selection brackets around the origin -->
  <g fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" transform="translate(340 470)">
    <path d="M0 60 V0 H60"/>
    <path d="M500 0 H560 V60"/>
    <path d="M0 150 V210 H60"/>
    <path d="M500 210 H560 V150"/>
  </g>

  <!-- the pinned snip, lifted up and to the right -->
  <g transform="translate(700 300)">
    <g filter="url(#shadow)">
      <rect x="-14" y="-14" width="548" height="218" rx="22" fill="#121722"/>
      <rect width="520" height="190" rx="14" fill="url(#img)"/>
      <path d="M0 190 L150 70 L250 150 L330 100 L520 190 Z" fill="#fff" fill-opacity=".35"/>
      <circle cx="420" cy="52" r="30" fill="#fff" fill-opacity=".75"/>
      <rect x="-14" y="-14" width="548" height="218" rx="22" fill="none" stroke="#ffb056" stroke-width="8"/>
    </g>
    <!-- pushpin -->
    <g transform="translate(500 10) rotate(45) scale(4.2)">
      <path d="M-11 -30 H11 A4 4 0 0 1 11 -22 L9 -22 L9 -6 L16 2 A4 4 0 0 1 16 8 H-16 A4 4 0 0 1 -16 2 L-9 -6 L-9 -22 L-11 -22 A4 4 0 0 1 -11 -30 Z" fill="url(#pin)"/>
      <path d="M0 8 V34" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
