<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3445"/>
      <stop offset="1" stop-color="#121722"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62a0ea" stop-opacity=".22"/>
      <stop offset="1" stop-color="#62a0ea" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- window -->
  <rect x="560" y="140" width="900" height="620" rx="30" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16" stroke-width="3"/>
  <!-- header bar -->
  <path d="M590 140h840a30 30 0 0 1 30 30v50H560v-50a30 30 0 0 1 30-30z" fill="#ffffff" fill-opacity=".05"/>
  <line x1="560" y1="220" x2="1460" y2="220" stroke="#ffffff" stroke-opacity=".12" stroke-width="3"/>
  <g fill="#ffffff" fill-opacity=".25">
    <circle cx="610" cy="180" r="12"/>
    <rect x="1290" y="166" width="28" height="28" rx="8"/>
    <rect x="1340" y="166" width="28" height="28" rx="8"/>
    <rect x="1390" y="166" width="28" height="28" rx="8"/>
  </g>

  <!-- rows (muted) -->
  <g fill="#ffffff">
    <!-- row 1 -->
    <circle cx="640" cy="290" r="26" fill-opacity=".14"/>
    <rect x="700" y="272" width="260" height="20" rx="10" fill-opacity=".22"/>
    <rect x="700" y="302" width="150" height="12" rx="6" fill-opacity=".12"/>
    <g fill-opacity=".14">
      <rect x="1150" y="277" width="26" height="26" rx="6"/><rect x="1186" y="277" width="26" height="26" rx="6"/><rect x="1222" y="277" width="26" height="26" rx="6"/>
      <rect x="1272" y="277" width="26" height="26" rx="6"/><rect x="1308" y="277" width="26" height="26" rx="6"/><rect x="1344" y="277" width="26" height="26" rx="6"/>
    </g>
    <circle cx="1412" cy="290" r="18" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="6"/>

    <!-- row 3 -->
    <circle cx="640" cy="550" r="26" fill-opacity=".14"/>
    <rect x="700" y="532" width="220" height="20" rx="10" fill-opacity=".22"/>
    <rect x="700" y="562" width="180" height="12" rx="6" fill-opacity=".12"/>
    <g fill-opacity=".14">
      <rect x="1150" y="537" width="26" height="26" rx="6"/><rect x="1186" y="537" width="26" height="26" rx="6"/><rect x="1222" y="537" width="26" height="26" rx="6"/>
      <rect x="1272" y="537" width="26" height="26" rx="6"/><rect x="1308" y="537" width="26" height="26" rx="6"/><rect x="1344" y="537" width="26" height="26" rx="6"/>
    </g>
    <circle cx="1412" cy="550" r="18" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="6"/>

    <!-- row 4 -->
    <circle cx="640" cy="680" r="26" fill-opacity=".14"/>
    <rect x="700" y="662" width="300" height="20" rx="10" fill-opacity=".22"/>
    <rect x="700" y="692" width="130" height="12" rx="6" fill-opacity=".12"/>
    <g fill-opacity=".14">
      <rect x="1150" y="667" width="26" height="26" rx="6"/><rect x="1186" y="667" width="26" height="26" rx="6"/><rect x="1222" y="667" width="26" height="26" rx="6"/>
      <rect x="1272" y="667" width="26" height="26" rx="6"/><rect x="1308" y="667" width="26" height="26" rx="6"/><rect x="1344" y="667" width="26" height="26" rx="6"/>
    </g>
    <circle cx="1412" cy="680" r="18" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="6"/>
  </g>

  <!-- row 2: active, lit by the key -->
  <rect x="562" y="360" width="896" height="120" fill="url(#glow)"/>
  <rect x="562" y="360" width="896" height="120" fill="#ffffff" fill-opacity=".05"/>
  <circle cx="640" cy="420" r="26" fill="#ffffff" fill-opacity=".3"/>
  <rect x="700" y="402" width="240" height="20" rx="10" fill="#ffffff" fill-opacity=".55"/>
  <rect x="700" y="432" width="160" height="12" rx="6" fill="#ffffff" fill-opacity=".25"/>
  <g fill="#62a0ea">
    <rect x="1140" y="392" width="36" height="56" rx="8"/><rect x="1186" y="392" width="36" height="56" rx="8"/><rect x="1232" y="392" width="36" height="56" rx="8"/>
    <rect x="1292" y="392" width="36" height="56" rx="8"/><rect x="1338" y="392" width="36" height="56" rx="8"/><rect x="1384" y="392" width="36" height="56" rx="8"/>
  </g>

  <!-- yubikey, plugged into the window at the active row -->
  <g>
    <!-- body -->
    <rect x="120" y="360" width="380" height="120" rx="60" fill="url(#key)"/>
    <!-- keyring hole -->
    <circle cx="185" cy="420" r="22" fill="#121722" fill-opacity=".55"/>
    <!-- touch pad: ring + dot, echoes the icon -->
    <circle cx="330" cy="420" r="30" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="8"/>
    <circle cx="330" cy="420" r="9" fill="#ffffff"/>
    <!-- usb plug -->
    <rect x="490" y="382" width="90" height="76" rx="10" fill="#dfe6f2"/>
    <rect x="510" y="398" width="60" height="10" rx="4" fill="#121722" fill-opacity=".45"/>
    <rect x="510" y="432" width="60" height="10" rx="4" fill="#121722" fill-opacity=".45"/>
  </g>
</svg>
